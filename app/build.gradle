plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.aotianneo.cryostasis'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.aotianneo.cryostasis"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
